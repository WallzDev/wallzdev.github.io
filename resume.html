<head>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<section>
  <h2>Resume</h2>
  <p>Gameplay programmer specializing in Unity (C#), with experience in movement systems, combat mechanics, and game feel.</p>

  <p>You can view or download my resume below.</p>

  <div class="resume-controls">
    <button onclick="zoomOut()">-</button>
    <span id="zoomLevel">100%</span>
    <button onclick="zoomIn()">+</button>
  </div>

  <div class="resume-wrapper">
    <iframe id="resumeFrame" src="AndresWallaceResume.pdf"></iframe>
  </div>

  <a href="AndresWallaceResume.pdf" class="resume-btn" download>
    Download PDF
  </a>
</section>

<script>
    let zoom = 1;
    const frame = document.getElementById("resumeFrame");
    const zoomText = document.getElementById("zoomLevel");

    function zoomIn() {
      zoom += 0.1;
      applyZoom();
    }

    function zoomOut() {
      zoom = Math.max(0.5, zoom - 0.1);
      applyZoom();
    }

    function applyZoom() {
      frame.style.transform = `scale(${zoom})`;
      zoomText.textContent = Math.round(zoom * 100) + "%";
    }
  </script>
